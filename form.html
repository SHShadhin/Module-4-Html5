<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pitha ghor</title>
    <style>
        form .basic-info label {
            display: block;
            margin-top: 10px;
        }
        fieldset {
            margin-bottom: 20px;
        } 
        input[type="submit"],[type="reset"]  {
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <header>
        <h2>Jamal er maa er pitha ghor</h2>
    </header>
    <main>
        <section>
            <form action="">
                <fieldset class="basic-info">
                    <legend>Basic info</legend>

                    <label for="name">Your Name</label>
                    <input type="text" placeholder="your name">
                    
                    <label for="email">Your Email</label>
                    <input type="email" name="email" id="" placeholder="your email">

                    <label for="password">Your Password</label>
                    <input type="password" name="" id="" placeholder="password">

                    <label for="submit"></label>
                    <input type="submit" value="Login">
                </fieldset>

                <fieldset>
                    <legend>
                        Pick One pitha
                    </legend>

                    <input type="radio" name="pitha" id="vapa">
                    <label for="vapa">Vapa Pitha</label>

                    <input type="radio" name="pitha" id="jamai">
                    <label for="jamai">Jamai Pitha</label>

                    <input type="radio" name="pitha" id="kushli">
                    <label for="kushli">Kushli Pitha</label>

                </fieldset>

                <fieldset>
                    <legend>Pick one or more vorta</legend>

                    <input type="checkbox" name="vorta" id="alu">
                    <label for="alu">Alu Vorta</label>

                    <input type="checkbox" name="vorta" id="daal">
                    <label for="daal">Daal Vorta</label>

                    <input type="checkbox" name="vorta" id="dim">
                    <label for="dim">Dim Vorta</label>
                </fieldset>

                <fieldset>
                    <legend>
                        Share your experience
                    </legend>
                    <textarea name="" id="" cols="30" rows="10"></textarea>
                </fieldset>
                <input type="submit" value="Submit">
                <input type="reset" value="Clear">
            </form>
        </section>
    </main>
</body>
</html>
